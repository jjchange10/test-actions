name: Issue Opened

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  on-issue-opened:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      # issue のタイトル等はユーザー入力のため、スクリプトインジェクション対策として env 経由で渡す
      - name: Show issue info
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          echo "Issue #${ISSUE_NUMBER} opened by @${ISSUE_AUTHOR}"
          echo "Title: ${ISSUE_TITLE}"
          echo "URL:   ${ISSUE_URL}"

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "@${ISSUE_AUTHOR} Issue を作成いただきありがとうございます！ (triggered by GitHub Actions)"
