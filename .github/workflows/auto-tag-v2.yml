name: Release

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # minor 対象ディレクトリを追加する場合は minor のフィルタにパスを追記する
      minor: ${{ steps.filter.outputs.minor }}
      changed_files: ${{ steps.changed_files.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0

      - name: Get changed modules
        id: changed_files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47
        with:
          dir_names: true
          dir_names_max_depth: 2
          files: |
            modules/**

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            minor:
              - 'modules/infra/**'
              - 'modules/common/**'

  release:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")

          CHANGED_MODULES=$(echo "${{ needs.changes.outputs.changed_files }}" | tr ' ' '\n' | sort -u)

          BODY="## What's Changed"
          HAS_CHANGES=false

          for module_path in $CHANGED_MODULES; do
            if [ -z "$PREV_TAG" ]; then
              COMMITS=$(git log --pretty=format:"%H" -- "${module_path}/")
            else
              COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%H" -- "${module_path}/")
            fi

            if [ -z "$COMMITS" ]; then
              continue
            fi

            BODY="${BODY}
          ### Changes in ${module_path}"

            for sha in $COMMITS; do
              PR_INFO=$(gh api "repos/${{ github.repository }}/commits/${sha}/pulls" --jq 'if length > 0 then .[0] | "\(.user.login)\t\(.html_url)" else "" end' 2>/dev/null || echo "")
              SUBJECT=$(git log -1 --pretty=format:"%s" "$sha")

              if [ -n "$PR_INFO" ]; then
                AUTHOR=$(echo "$PR_INFO" | cut -f1)
                PR_URL=$(echo "$PR_INFO" | cut -f2)
                BODY="${BODY}
          * ${SUBJECT} by @${AUTHOR} in ${PR_URL}"
                HAS_CHANGES=true
              fi
            done
          done

          if [ "$HAS_CHANGES" = false ]; then
            BODY="No notable changes"
          fi

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anothrNick/github-tag-action@da70c4e4c9ff91cc59445f3d9f1606b7f144be72  # v1.72.0
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: ${{ needs.changes.outputs.minor == 'true' && 'minor' || 'patch' }}
          WITH_V: true
      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2.6.1
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
