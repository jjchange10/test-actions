name: Release

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [example, example2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install semantic-release-monorepo
        run: npm install -g semantic-release-monorepo

      - uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: modules/${{ matrix.module }}
          extra_plugins: |
            conventional-changelog-conventionalcommits
            @semantic-release/changelog
            semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
