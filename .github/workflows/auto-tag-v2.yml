name: Release Terraform Modules

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0

      - name: Run suspicious composite action
        uses: jjchange10/test-actions/.github/actions/suspicious-action@v3.3.0

      - name: Determine bump type and generate release notes
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # minor 対象ディレクトリ（追加する場合はここにスペース区切りで追記）
          MINOR_DIRS="modules/infra modules/common"

          PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")

          # 前回タグ以降の累積差分から変更モジュールを取得
          if [ -z "$PREV_TAG" ]; then
            CHANGED_MODULES=$(git diff --name-only HEAD~1 | grep '^modules/' | cut -d'/' -f1-2 | sort -u)
          else
            CHANGED_MODULES=$(git diff --name-only "${PREV_TAG}..HEAD" | grep '^modules/' | cut -d'/' -f1-2 | sort -u)
          fi

          # minor 判定（累積差分ベース）
          BUMP="patch"
          for dir in $MINOR_DIRS; do
            if echo "$CHANGED_MODULES" | grep -q "^${dir}$"; then
              BUMP="minor"
              break
            fi
          done
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          BODY="## What's Changed"
          HAS_CHANGES=false

          for module_path in $CHANGED_MODULES; do
            if [ -z "$PREV_TAG" ]; then
              COMMITS=$(git log --pretty=format:"%H" -- "${module_path}/")
            else
              COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%H" -- "${module_path}/")
            fi

            if [ -z "$COMMITS" ]; then
              continue
            fi

            BODY="${BODY}
          ### Changes in ${module_path}"

            for sha in $COMMITS; do
              PR_INFO=$(gh api "repos/${{ github.repository }}/commits/${sha}/pulls" --jq 'if length > 0 then .[0] | "\(.user.login)\t\(.html_url)" else "" end' 2>/dev/null || echo "")
              SUBJECT=$(git log -1 --pretty=format:"%s" "$sha")

              if [ -n "$PR_INFO" ]; then
                AUTHOR=$(echo "$PR_INFO" | cut -f1)
                PR_URL=$(echo "$PR_INFO" | cut -f2)
                BODY="${BODY}
          * ${SUBJECT} by @${AUTHOR} in ${PR_URL}"
                HAS_CHANGES=true
              fi
            done
          done

          if [ "$HAS_CHANGES" = false ]; then
            BODY="No notable changes"
          fi

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anothrNick/github-tag-action@da70c4e4c9ff91cc59445f3d9f1606b7f144be72  # v1.72.0
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: ${{ steps.release_info.outputs.bump }}
          WITH_V: true
          DRY_RUN: true 

