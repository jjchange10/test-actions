name: GitHub Actions Security Scanner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/semgrep-rules/**"
      - ".github/scanner-repos.json"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/semgrep-rules/**"
      - ".github/scanner-repos.json"
  schedule:
    # 毎週月曜日 02:00 UTC に自動スキャン
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: scanner-repos.json からスキャン対象リポジトリを読み込み
  #         matrix を動的生成する
  # ──────────────────────────────────────────────────────────────
  setup:
    name: "Load Target Repositories"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load-repos.outputs.matrix }}
      count: ${{ steps.load-repos.outputs.count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Load repos and generate matrix
        id: load-repos
        run: |
          count=$(jq '.repos | length' .github/scanner-repos.json)
          matrix=$(jq -c '{repo: .repos}' .github/scanner-repos.json)

          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

          echo "スキャン対象リポジトリ一覧 (${count}件):"
          jq -r '.repos[]' .github/scanner-repos.json | sed 's/^/  - /'

  # ──────────────────────────────────────────────────────────────
  # Job 2: 各リポジトリに対して zizmor + semgrep を並列実行
  #
  # matrix.repo ごとに独立した runner が起動するため、
  # リポジトリ数に比例して並列スキャンが実行される。
  # fail-fast: false により 1 つのリポジトリで問題が見つかっても
  # 残りのスキャンは継続する。
  # ──────────────────────────────────────────────────────────────
  scan:
    name: "Scan ${{ matrix.repo }}"
    needs: setup
    if: ${{ needs.setup.outputs.count > 0 }}
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      # スキャナーリポジトリ（semgrep ルール取得用）を scanner/ に配置
      - name: Checkout scanner (this repo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          path: scanner

      # スキャン対象リポジトリを target/ に配置
      # プライベートリポジトリの場合は SCAN_TOKEN シークレット（対象リポジトリへの
      # contents: read 権限を持つ PAT）が必要。パブリックリポジトリは不要。
      - name: Checkout target repository (${{ matrix.repo }})
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.SCAN_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target

      - name: Install tools
        run: pip install zizmor==1.24.0 semgrep==1.159.0

      # ── zizmor: Action の hash ピン留め確認 ─────────────────
      # ── semgrep: npm バージョン固定確認 ─────────────────────
      # 両ツールを必ず最後まで実行し、問題があれば最終的に exit 1 を返す
      - name: Run security scans
        shell: bash
        run: |
          SCAN_EXIT=0

          # ── zizmor ────────────────────────────────────────────
          echo "::group::[${{ matrix.repo }}] zizmor – Action Hash Pinning"
          if [ -d "target/.github" ]; then
            dirs=""
            [ -d "target/.github/workflows" ] && dirs="${dirs} target/.github/workflows"
            [ -d "target/.github/actions"   ] && dirs="${dirs} target/.github/actions"

            if [ -n "${dirs}" ]; then
              zizmor --no-online-audits --format plain ${dirs} || SCAN_EXIT=$?
            else
              echo "ℹ .github/workflows/ も .github/actions/ も存在しません: ${{ matrix.repo }}"
            fi
          else
            echo "ℹ .github/ が存在しません: ${{ matrix.repo }}"
          fi
          echo "::endgroup::"

          # ── semgrep ───────────────────────────────────────────
          echo "::group::[${{ matrix.repo }}] semgrep – npm Version Pinning"
          if [ -d "target/.github" ]; then
            semgrep \
              --config scanner/.github/semgrep-rules/npm-unpinned.yml \
              --error \
              --include="*.yml" \
              --include="*.yaml" \
              target/.github/ || SCAN_EXIT=$?
          else
            echo "ℹ .github/ が存在しません: ${{ matrix.repo }}"
          fi
          echo "::endgroup::"

          exit "${SCAN_EXIT}"
