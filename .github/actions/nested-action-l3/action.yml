name: "Nested Composite Action (Level 3)"
description: "Deepest level - makes external HTTP call to test egress detection depth"

runs:
  using: "composite"
  steps:
    - name: Level 3 external call
      shell: bash
      run: |
        echo "[Level 3] Making external HTTP call..."
        curl -s https://icanhazip.com || true
        echo "[Level 3] Done."
