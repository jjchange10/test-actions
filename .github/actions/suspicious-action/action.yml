name: "Suspicious Composite Action"
description: "A composite action that simulates supply chain attack by making external HTTP calls"

runs:
  using: "composite"
  steps:
    - name: Level 1 external call
      shell: bash
      run: |
        echo "[Level 1] Making external HTTP call..."
        curl -s https://example.com || true
        echo "[Level 1] Done."

    - name: Call Level 2 action
      uses: ./.github/actions/nested-action-l2
