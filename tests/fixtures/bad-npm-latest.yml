name: Bad Workflow – npm @latest (semgrep ERROR expected)

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # BAD: @latest は再現性がなく、将来の破壊的変更を取り込む可能性あり
      - name: Install with latest
        run: npm install lodash@latest

      # BAD: 複数パッケージで @latest 混在
      - name: Install multiple with latest
        run: npm install express@latest react@latest

      # BAD: pip でも @latest 相当の latest 指定
      - name: Install pip latest
        run: pip install requests==latest
